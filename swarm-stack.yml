# Override Swarm pour le déploiement en cluster de production
# Usage: docker stack deploy -c docker-compose.yml -c swarm-stack.yml demo

services:
  proxy:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.30'
          memory: 128M

  front:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  back:
    deploy:
      replicas: 1
      resources:
        reservations: # Requis pour que l'autoscaler analyse la charge CPU
          cpus: '0.20'
          memory: 128M
        limits:
          cpus: '1.0'
          memory: 512M

  # Service d'autoscaling autonome (déployé uniquement en mode Swarm)
  autoscaler:
    image: autoscaler:latest
    build:
      context: .
      dockerfile: Dockerfile.autoscaler
    environment:
      - SERVICE=back
      - STACK_NAME=demo
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

networks:
  app-net:
    driver: overlay
    attachable: true
