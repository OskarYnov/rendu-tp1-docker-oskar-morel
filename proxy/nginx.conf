server {
    listen 80;

    # Redirige le trafic racine vers le service Front
    location / {
        proxy_pass http://front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirige le trafic /api vers le service Back
    location /api {
        proxy_pass http://back:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}