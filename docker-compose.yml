services:
  proxy:
    image: app-proxy:latest
    build: ./proxy
    ports:
      - "${PROXY_PORT:-8080}:80"
    environment:
      - PROXY_MODE=${PROXY_MODE:-normal}
    depends_on:
      - front
      - back
    networks:
      - app-net

  front:
    image: app-front:latest
    build: ./front
    environment:
      - APP_ENV=${APP_ENV:-prod}
    networks:
      - app-net

  back:
    image: app-back:latest
    build: ./back
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
    volumes:
      - mtg_data:/app/data
      - mtg_images:/app/images
    networks:
      - app-net

volumes:
  mtg_data:
  mtg_images:

networks:
  app-net:
    driver: bridge
