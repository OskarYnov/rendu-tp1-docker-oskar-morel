version: '3.8'

services:
  proxy:
    build: ./proxy
    ports:
      - "${PROXY_PORT}:80"
    environment:
      - PROXY_MODE=${PROXY_MODE}
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    depends_on:
      - front
      - back
    networks:
      - app-net

  front:
    build: ./front
    environment:
      - APP_ENV=${APP_ENV}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - app-net

  back:
    build: ./back
    environment:
      - STORAGE_TYPE=${STORAGE_TYPE}
    volumes:
      - mtg_data:/app/data
      - mtg_images:/app/images
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M  
    networks:
      - app-net

volumes:
  mtg_data:
  mtg_images:

networks:
  app-net:
    driver: bridge