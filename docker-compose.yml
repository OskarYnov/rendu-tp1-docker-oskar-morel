version: '3.8'

services:
  proxy:
    build: ./proxy
    ports:
      - "8080:80"
    environment:
      - PROXY_MODE=production
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 128M
    depends_on:
      - front
      - back

  front:
    build: ./front
    environment:
      - APP_ENV=production
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  back:
    build: ./back
    environment:
      - DB_HOST=internal-db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M  